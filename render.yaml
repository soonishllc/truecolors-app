# Render blueprint: Dashboard → New → Blueprint, pick this repo. Secrets marked sync: false are asked for once.
databases:
  - name: truecolors-db
    plan: basic-256mb
    region: virginia
    postgresMajorVersion: "17"

services:
  - type: web
    name: truecolors-app
    runtime: docker
    plan: standard
    region: virginia
    healthCheckPath: /api/health
    # Keep one instance: the cron tick's no-overlap guard lives in the server process.
    numInstances: 1
    # On a subdomain of the store, so sign-in works inside the store's pages (browsers block other sites' cookies
    # in a frame). The store's app proxy points at https://app.truecolors.global/proxy.
    domains:
      - app.truecolors.global
    envVars:
      - key: APP_URL
        value: https://app.truecolors.global
      - key: STORE_URL
        value: https://www.truecolors.global
      - key: SHOPIFY_PROXY_SECRET
        sync: false
      - key: DATABASE_URL
        fromDatabase: { name: truecolors-db, property: connectionString }
      - key: SESSION_SECRET
        generateValue: true
      - key: CRON_SECRET
        generateValue: true
      - key: PAYOUT_ENCRYPTION_KEY
        sync: false
      - key: ADMIN_EMAILS
        value: kevin@probablyfine.ae
      - key: AI_PROVIDER
        value: openai
      - key: OPENAI_API_KEY
        sync: false
      - key: S3_BUCKET
        sync: false
      - key: S3_ENDPOINT
        sync: false
      # "auto" for Cloudflare R2; the bucket's region (e.g. us-east-1) for AWS S3, with S3_ENDPOINT left empty.
      - key: S3_REGION
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: SHOPIFY_ADMIN_TOKEN
        sync: false
      - key: SHOPIFY_WEBHOOK_SECRET
        sync: false
      # The Online Store sales channel (truecolors.global: 190786207986); without it campaign products aren't on the store.
      - key: SHOPIFY_ONLINE_STORE_PUBLICATION_ID
        value: "190786207986"
      - key: SHOPIFY_AE_PUBLICATION_ID
        value: "212825800946"
      - key: SHOPIFY_US_PUBLICATION_ID
        value: "212661010674"
      - key: SHOPIFY_US_PRICE_LIST_ID
        value: "20741030130"
      - key: RESEND_API_KEY
        sync: false
      - key: DESIGNER_AGREEMENT_VERSION
        sync: false
      # Wholesale: the WhatsApp order bot (Claude, through Gorgias' WhatsApp inbox), stock and FedEx from Cancún.
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: GORGIAS_DOMAIN
        sync: false
      - key: GORGIAS_USERNAME
        sync: false
      - key: GORGIAS_API_KEY
        sync: false
      - key: GORGIAS_WEBHOOK_SECRET
        sync: false
      - key: WHOLESALE_LOCATION_ID
        sync: false
      - key: WHOLESALE_BANK_DETAILS
        sync: false
      - key: FEDEX_API_KEY
        sync: false
      - key: FEDEX_SECRET_KEY
        sync: false
      - key: FEDEX_ACCOUNT_NUMBER
        sync: false

  # Closes campaigns, charges funded ones, sends milestone emails and issues fan rewards.
  - type: cron
    name: truecolors-tick
    runtime: node
    plan: starter
    region: virginia
    schedule: "*/15 * * * *"
    buildCommand: "true"
    startCommand: node scripts/cron-tick.mjs
    envVars:
      - key: APP_URL
        value: https://app.truecolors.global
      - key: CRON_SECRET
        fromService: { type: web, name: truecolors-app, envVarKey: CRON_SECRET }
